; Production PHP settings — Área Verde
; CVE-2026-109618 / CVE-2026-109619: only a patched PHP (8.4.27+) is a complete fix.
; The settings below reduce some attack paths and do not replace that update.

memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 8M
max_execution_time = 60
max_input_time = 60

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Blocks confirmed session upload-progress path for CVE-2026-109619
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
