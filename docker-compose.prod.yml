# Produção — Área Verde
# PHP pinado em 8.4.27 (CVE-2026-109618, CVE-2026-109619).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-areaverde}
      POSTGRES_USER: ${DB_USERNAME:-areaverde}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-areaverde} -d ${DB_DATABASE:-areaverde}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: area-verde-app:8.4.27
    restart: unless-stopped
    environment: &app_env
      APP_NAME: ${APP_NAME:-Área Verde}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-areaverde}
      DB_USERNAME: ${DB_USERNAME:-areaverde}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
      REVERB_HOST: ${REVERB_HOST:-localhost}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      VITE_APP_NAME: ${APP_NAME:-Área Verde}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-443}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
      CONTAINER_ROLE: app
    volumes:
      - storage_data:/var/www/html/storage/app
      - public_html:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  queue:
    image: area-verde-app:8.4.27
    restart: unless-stopped
    environment:
      <<: *app_env
      CONTAINER_ROLE: queue
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - app

  reverb:
    image: area-verde-app:8.4.27
    restart: unless-stopped
    environment:
      <<: *app_env
      CONTAINER_ROLE: reverb
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_html:/var/www/html/public:ro
    depends_on:
      - app
      - reverb
    networks:
      - app

volumes:
  postgres_data:
  storage_data:
  public_html:

networks:
  app:
    driver: bridge
